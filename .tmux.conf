# --- General ---
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10        # no laggy Esc in Neovim / vi-mode shells
set -g focus-events on        # Neovim notices pane focus changes

# --- Keys ---
set -g prefix2 C-Space        # second prefix; Ctrl+b still works
bind r source-file ~/.tmux.conf \; display "reloaded"

# --- Windows and panes ---
set -g base-index 1           # windows numbered from 1
set -g pane-base-index 1      # panes numbered from 1
set -g renumber-windows on    # close gaps when a window closes

# New windows and splits open in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

# --- Status bar ---
set -g status-position top
set -g status-left-length 20
